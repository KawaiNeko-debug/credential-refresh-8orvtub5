name: Refresh Credentials
run-name: login-refresh-${{ inputs.job_id }}

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Manager credential refresh job id"
        required: true
      mode:
        description: "Refresh mode"
        required: false
        default: "credentials"
      group_count:
        description: "Number of groups in this refresh job"
        required: true
      max_parallel:
        description: "Maximum parallel runner jobs"
        required: false
        default: "12"
      browsers_per_runner:
        description: "Browser concurrency inside one runner"
        required: false
        default: "5"

jobs:
  build-matrix:
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - id: groups
        shell: bash
        run: |
          count="${{ inputs.group_count }}"
          if ! [[ "$count" =~ ^[0-9]+$ ]] || [ "$count" -le 0 ]; then
            echo "group_count must be a positive integer" >&2
            exit 1
          fi
          if [ "$count" -gt 256 ]; then
            echo "group_count must be <= 256" >&2
            exit 1
          fi
          groups="$(seq 0 $((count - 1)) | jq -R . | jq -s -c .)"
          echo "groups=$groups" >> "$GITHUB_OUTPUT"

  refresh:
    needs: build-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: ${{ fromJSON(inputs.max_parallel) }}
      matrix:
        group_index: ${{ fromJSON(needs.build-matrix.outputs.groups) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v6
        with:
          go-version: "1.24.x"
          cache-dependency-path: go.sum

      - name: Detect runner browser
        id: detect-chrome
        shell: bash
        run: |
          set -euo pipefail
          for name in google-chrome google-chrome-stable chromium chromium-browser; do
            if path="$(command -v "$name" 2>/dev/null)"; then
              echo "found=true" >> "$GITHUB_OUTPUT"
              echo "path=$path" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "found=false" >> "$GITHUB_OUTPUT"

      - name: Install Chrome
        id: setup-chrome
        if: steps.detect-chrome.outputs.found != 'true'
        uses: browser-actions/setup-chrome@v2

      - name: Resolve browser path
        id: chrome
        shell: bash
        env:
          EXISTING_CHROME: ${{ steps.detect-chrome.outputs.path }}
          INSTALLED_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          set -euo pipefail
          chrome_path="$EXISTING_CHROME"
          if [ -z "$chrome_path" ]; then
            chrome_path="$INSTALLED_CHROME"
          fi
          if [ -z "$chrome_path" ] || [ ! -x "$chrome_path" ]; then
            echo "Chrome/Chromium executable not found" >&2
            exit 1
          fi
          echo "path=$chrome_path" >> "$GITHUB_OUTPUT"

      - name: Refresh group
        env:
          REFRESH_MANAGER_URL: ${{ secrets.REFRESH_MANAGER_URL }}
          REFRESH_MANAGER_TOKEN: ${{ secrets.REFRESH_MANAGER_TOKEN }}
          TARGET_MARKER: ${{ secrets.TARGET_MARKER }}
          REFRESH_BROWSER_PATH: ${{ steps.chrome.outputs.path }}
          REFRESH_JOB_ID: ${{ inputs.job_id }}
          REFRESH_GROUP_INDEX: ${{ matrix.group_index }}
          REFRESH_CONCURRENCY: ${{ inputs.browsers_per_runner }}
          REFRESH_LOGIN_TIMEOUT: 5m
          REFRESH_HEADLESS: "true"
        run: go run ./cmd/login-refresher
